name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-x64
            runner: macos-26-intel
            target: x86_64-apple-darwin
          - name: macos-arm64
            runner: macos-26
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: scripts/check-release-tag.sh "$GITHUB_REF_NAME"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,${{ matrix.target }}

      - uses: oven-sh/setup-bun@v2

      - name: Package release binary
        run: scripts/package-release-binary.sh --out-dir dist --target "${{ matrix.target }}"

      - name: Smoke release archive
        shell: bash
        run: |
          archive="$(find dist -maxdepth 1 -name 'verlet-*.tar.gz' | head -n 1)"
          test -n "$archive"
          scripts/smoke-release-archive.sh "$archive"

      - name: Smoke installer
        shell: bash
        run: |
          archive="$(find dist -maxdepth 1 -name 'verlet-*.tar.gz' | head -n 1)"
          test -n "$archive"
          scripts/smoke-install.sh "$archive"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: verlet-${{ matrix.target }}
          path: |
            dist/verlet-*.tar.gz
            dist/verlet-*.tar.gz.sha256
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Prepare install assets
        shell: bash
        run: |
          scripts/write-release-manifest.sh \
            --out-dir dist \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME"
          cp scripts/install.sh dist/install.sh

      - name: Smoke installer against Linux release artifact
        shell: bash
        run: |
          archive="$(find dist -maxdepth 1 -name 'verlet-*-x86_64-unknown-linux-gnu.tar.gz' | head -n 1)"
          test -n "$archive"
          scripts/smoke-install.sh "$archive"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=(
            --repo "$GITHUB_REPOSITORY"
            --title "$GITHUB_REF_NAME"
            --generate-notes
          )
          case "$GITHUB_REF_NAME" in
            *-*) release_args+=(--prerelease) ;;
          esac

          gh release create "$GITHUB_REF_NAME" dist/* "${release_args[@]}"

      - name: Trigger Homebrew tap update
        env:
          GH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
        run: |
          # Keep releases green while the cross-repo dispatch token is unprovisioned.
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "TAP_DISPATCH_TOKEN not configured; skipping tap dispatch"
            exit 0
          fi
          gh workflow run update-verlet.yml --repo emotionscientific/homebrew-tap
