name: Scenario nightly

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scenario-sweep:
    name: Rotating scenario sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Same headroom problem as the Verify workspace job (EMO-515): the
      # debug test build no longer fits where the work folder lives, so free
      # bloat and put the cargo target dir on the big root disk.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/lib/jvm /opt/microsoft /usr/lib/google-cloud-sdk \
            /usr/local/share/powershell /usr/share/swift /opt/az
          sudo docker image prune --all --force > /dev/null
          sudo mkdir -p /opt/cargo-target
          sudo chown "$(id -u):$(id -g)" /opt/cargo-target
          ln -sfn /opt/cargo-target "${GITHUB_WORKSPACE%/*}/.cargo-target"
          df -h
          df -i /
          findmnt -T "${GITHUB_WORKSPACE%/*}" || true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - name: Run rotating sweep
        id: sweep
        continue-on-error: true
        env:
          # Same heterogeneous-disk fleet as the Verify workspace job
          # (EMO-515): line tables keep the debug test build inside the
          # small-root runners' free space.
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          CARGO_PROFILE_TEST_DEBUG: line-tables-only
          RUST_MIN_STACK: "16777216"
          VERLET_SCENARIO_SWEEP_BASE_SEED: ${{ github.run_id }}
          VERLET_SCENARIO_SWEEP_COUNT: "24"
          VERLET_SCENARIO_SWEEP_MAX_OPS: "8"
          VERLET_SCENARIO_SWEEP_COMMIT_SHA: ${{ github.sha }}
          VERLET_SCENARIO_SWEEP_RECEIPT_PATH: ${{ runner.temp }}/scenario-nightly-receipt.json
        run: cargo test -p verlet --lib scenario_nightly_sweep -- --ignored --nocapture
      - name: Witness scenario receipt
        if: always()
        env:
          RECEIPT: ${{ runner.temp }}/scenario-nightly-receipt.json
          SWEEP_OUTCOME: ${{ steps.sweep.outcome }}
          BASE_SEED: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [[ ! -s "$RECEIPT" ]]; then
            jq -n \
              --argjson base_seed "$BASE_SEED" \
              --arg commit_sha "$COMMIT_SHA" \
              --arg outcome "$SWEEP_OUTCOME" \
              --argjson corpus_size "$(jq length crates/verlet-kernel/tests/fixtures/scenarios/corpus.json)" \
              '{base_seed: $base_seed, count: 24, max_ops: 8, per_intensity_tallies: {sparse: 0, moderate: 0, hostile: 0}, failures: [{seed: null, kind: "sweep-process-failure", detail: $outcome}], corpus_size: $corpus_size, commit_sha: $commit_sha, status: "failed"}' \
              > "$RECEIPT"
          fi
          {
            echo '## Scenario nightly receipt'
            echo '```json'
            cat "$RECEIPT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload scenario receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scenario-nightly-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/scenario-nightly-receipt.json
          if-no-files-found: error
      - name: Enforce sweep result
        if: steps.sweep.outcome != 'success'
        run: exit 1
