[workspace]
members = [
    "crates/verlet-agent",
    "crates/verlet-abi",
    "crates/verlet-history",
    "crates/verlet-history-sqlite",
    "crates/verlet-chat",
    "crates/verlet-kernel",
    "crates/verlet-metadata",
    "crates/verlet-operations",
    "crates/verlet-process",
    "crates/verlet-provider",
    "crates/verlet-runtime-contracts",
    "crates/verlet-sqlite",
    "crates/verlet-vfs",
    "crates/verlet-vbash",
    "crates/verlet-wasm",
    "crates/verlet-guest-sdk",
    "crates/verlet-guest-sdk-macros",
    "crates/verlet-io-core",
    "crates/verlet-io-pgqrs",
    "crates/verlet-io-telegram",
    "tools/trace-ab",
    "agent-tools/tool-core",
    "agent-tools/tool-read",
    "agent-tools/tool-write",
    "agent-tools/tool-edit",
    "agent-tools/tool-glob",
    "agent-tools/tool-grep",
    "agent-tools/wasm/abi-fs",
]
default-members = ["crates/verlet-kernel"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.5.1"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
bashkit = { version = "0.17.1", features = ["realfs"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
crc32fast = "1.5"
croner = "3.0.1"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-executor = "0.3"
futures-util = "0.3.32"
getrandom = "0.3"
globset = "0.4.20"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
hex = "0.4"
hmac = "0.13"
humantime = "2.3"
ignore = "0.4.33"
libc = "0.2"
log = "0.4"
object_store = { version = "0.13.2", features = ["aws"] }
pgqrs = { version = "0.15.3", default-features = false }
proc-macro2 = "1"
quote = "1"
ratatui = "=0.30.2"
regex = "1.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# ADR 0005 decision 8: retained for the ingress IO-state enclave until EMO-409.
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# verlet-provider pins sha2 0.11 locally to match hmac 0.13; everything else is on 0.10.
sha2 = "0.10"
strum = { version = "0.28", features = ["derive"] }
subtle = "2"
syn = { version = "2", features = ["full"] }
tempfile = "3"
thiserror = "2"
tokio = "1"
tokio-tungstenite = "0.28"
tokio-util = "0.7"
toml = "0.9"
# Pinned exact: tuika is pre-1.0 and minor releases may break API. Upgrades are
# deliberate, reviewed changes (EMO-545).
tuika = "=0.11.1"
turso = "=0.8.0-pre.7"
turso_core = "=0.8.0-pre.7"
uuid = "1"
wasmtime = { version = "48.0.1", default-features = false, features = ["async", "cache", "cranelift", "runtime", "std"] }
wat = "1"
